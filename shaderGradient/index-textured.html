<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shader Gradient — Arcs</title>
<style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; }
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lil-gui@0.19"></script>
<script>
// ─────────────────────────────────────────────
// Shader Gradient — animated warm gradient overlaid with bright
// parabolic "horizon" arcs. Single fragment shader on a fullscreen
// quad. Up to 4 arcs, each parametrised independently.
// ─────────────────────────────────────────────

const MAX_STREAKS = 4;

const vertSrc = `
varying vec2 vUv;
void main() {
    vUv = uv;
    gl_Position = vec4(position, 1.0);
}
`;

const fragSrc = `
precision highp float;
varying vec2 vUv;

uniform vec2  uResolution;
uniform float uTime;

// Gradient
uniform vec3  uColor1;
uniform vec3  uColor2;
uniform vec3  uColor3;
uniform vec3  uColor4;
uniform float uNoiseScale;
uniform float uSpeed;
uniform float uGrain;
uniform float uContrast;
uniform float uBrightness;

// Streaks (arcs)
uniform vec3  uStreakColor;
uniform int   uStreakCount;
// per-streak: x=yCenter, y=curvature, z=tilt, w=thickness
uniform vec4  uStreakA[${MAX_STREAKS}];
// per-streak: x=intensity, y=haloIntensity, z=haloWidth, w=unused
uniform vec4  uStreakB[${MAX_STREAKS}];

// ── value noise + fbm ──
float hash(vec2 p) {
    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}
float noise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    vec2 u = f * f * (3.0 - 2.0 * f);
    return mix(
        mix(hash(i),                 hash(i + vec2(1.0, 0.0)), u.x),
        mix(hash(i + vec2(0.0,1.0)), hash(i + vec2(1.0, 1.0)), u.x),
        u.y);
}
float fbm(vec2 p) {
    float v = 0.0;
    float a = 0.5;
    for (int k = 0; k < 5; k++) {
        v += a * noise(p);
        p *= 2.02;
        a *= 0.5;
    }
    return v;
}

void main() {
    vec2 uv = vUv;
    float aspect = uResolution.x / max(uResolution.y, 1.0);
    vec2 sUv = vec2(uv.x * aspect, uv.y);

    float t = uTime * uSpeed;

    // Three offset FBM fields drive a 4-way color blend, so the gradient
    // looks like flowing zones of different hues rather than a single ramp.
    float n1 = fbm(sUv * uNoiseScale         + vec2( t * 0.30, t * 0.22));
    float n2 = fbm(sUv * uNoiseScale * 1.70  + vec2(-t * 0.18, t * 0.31) + vec2(13.0, 7.0));
    float n3 = fbm(sUv * uNoiseScale * 0.90  + vec2( t * 0.12,-t * 0.26) + vec2(-5.0, 9.0));

    vec3 c12 = mix(uColor1, uColor2, smoothstep(0.10, 0.90, n1));
    vec3 c34 = mix(uColor3, uColor4, smoothstep(0.10, 0.90, n3));
    vec3 col = mix(c12, c34, smoothstep(0.25, 0.75, n2));

    // ── streak arcs ─────────────────────────────
    // A streak's brightness is a Gaussian in the perpendicular distance to a
    // parabola y_curve(x) = yCenter + curvature * (1 - 4*(x-0.5)^2) + tilt*(x-0.5).
    // A second wider Gaussian adds a soft halo so the highlight reads as
    // photographic, not a hard line.
    // (Loop unrolled — WebGL 1.0 won't dynamic-index a uniform array.)
    float xRel = uv.x - 0.5;
    float xSq  = xRel * xRel;
    float streakSum = 0.0;
    vec4 A; vec4 B; float yCurve; float dy; float thick; float core; float halo; float gate;

    gate = step(0.5, float(uStreakCount) - 0.0);
    A = uStreakA[0]; B = uStreakB[0];
    yCurve = A.x + A.y * (1.0 - 4.0 * xSq) + A.z * xRel;
    dy = uv.y - yCurve;
    thick = max(A.w, 0.001);
    core = exp(-(dy * dy) / (thick * thick));
    halo = exp(-(dy * dy) / max(B.z * B.z, 1e-4));
    streakSum += gate * (B.x * core + B.y * halo);

    gate = step(0.5, float(uStreakCount) - 1.0);
    A = uStreakA[1]; B = uStreakB[1];
    yCurve = A.x + A.y * (1.0 - 4.0 * xSq) + A.z * xRel;
    dy = uv.y - yCurve;
    thick = max(A.w, 0.001);
    core = exp(-(dy * dy) / (thick * thick));
    halo = exp(-(dy * dy) / max(B.z * B.z, 1e-4));
    streakSum += gate * (B.x * core + B.y * halo);

    gate = step(0.5, float(uStreakCount) - 2.0);
    A = uStreakA[2]; B = uStreakB[2];
    yCurve = A.x + A.y * (1.0 - 4.0 * xSq) + A.z * xRel;
    dy = uv.y - yCurve;
    thick = max(A.w, 0.001);
    core = exp(-(dy * dy) / (thick * thick));
    halo = exp(-(dy * dy) / max(B.z * B.z, 1e-4));
    streakSum += gate * (B.x * core + B.y * halo);

    gate = step(0.5, float(uStreakCount) - 3.0);
    A = uStreakA[3]; B = uStreakB[3];
    yCurve = A.x + A.y * (1.0 - 4.0 * xSq) + A.z * xRel;
    dy = uv.y - yCurve;
    thick = max(A.w, 0.001);
    core = exp(-(dy * dy) / (thick * thick));
    halo = exp(-(dy * dy) / max(B.z * B.z, 1e-4));
    streakSum += gate * (B.x * core + B.y * halo);

    streakSum = clamp(streakSum, 0.0, 1.0);
    col = mix(col, uStreakColor, streakSum);

    // contrast around 0.5, then brightness
    col = (col - 0.5) * uContrast + 0.5;
    col *= uBrightness;

    // film grain
    float g = (hash(uv * 800.0 + t * 60.0) - 0.5) * uGrain;
    col += g;

    gl_FragColor = vec4(col, 1.0);
}
`;

// ─────────────────────────────────────────────
// Renderer / scene
// ─────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

// ─────────────────────────────────────────────
// Parameters — defaults aim at the warm cream-arc reference image.
// ─────────────────────────────────────────────
const params = {
    // Gradient palette (cycled with the noise fields)
    color1:      '#ff8a3d',
    color2:      '#ffb86a',
    color3:      '#fff3d6',
    color4:      '#ffd680',

    // Background
    noiseScale:  1.20,   // larger = tighter, more zones
    speed:       0.15,   // animation rate
    contrast:    1.05,
    brightness:  1.00,
    grain:       0.025,

    // Arc highlights
    streakColor: '#ffffff',
    streakCount: 2,

    s1y:   0.32, s1c:  0.28, s1t: 0.00, s1th: 0.045, s1i: 0.95, s1h: 0.20, s1hw: 0.22,
    s2y:  -0.10, s2c:  0.22, s2t: 0.00, s2th: 0.075, s2i: 0.65, s2h: 0.18, s2hw: 0.28,
    s3y:   0.85, s3c: -0.15, s3t: 0.00, s3th: 0.040, s3i: 0.50, s3h: 0.15, s3hw: 0.25,
    s4y:  -0.40, s4c:  0.15, s4t: 0.00, s4th: 0.060, s4i: 0.45, s4h: 0.12, s4hw: 0.30,
};

const uniforms = {
    uTime:        { value: 0 },
    uResolution:  { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
    uColor1:      { value: new THREE.Color(params.color1) },
    uColor2:      { value: new THREE.Color(params.color2) },
    uColor3:      { value: new THREE.Color(params.color3) },
    uColor4:      { value: new THREE.Color(params.color4) },
    uNoiseScale:  { value: params.noiseScale },
    uSpeed:       { value: params.speed },
    uGrain:       { value: params.grain },
    uContrast:    { value: params.contrast },
    uBrightness:  { value: params.brightness },
    uStreakColor: { value: new THREE.Color(params.streakColor) },
    uStreakCount: { value: params.streakCount },
    uStreakA:     { value: [] },
    uStreakB:     { value: [] },
};

for (let i = 0; i < MAX_STREAKS; i++) {
    uniforms.uStreakA.value.push(new THREE.Vector4(0, 0, 0, 0.05));
    uniforms.uStreakB.value.push(new THREE.Vector4(0, 0, 0.2, 0));
}

function syncStreaks() {
    for (let i = 0; i < MAX_STREAKS; i++) {
        const n = i + 1;
        uniforms.uStreakA.value[i].set(
            params[`s${n}y`],
            params[`s${n}c`],
            params[`s${n}t`],
            params[`s${n}th`],
        );
        uniforms.uStreakB.value[i].set(
            params[`s${n}i`],
            params[`s${n}h`],
            params[`s${n}hw`],
            0,
        );
    }
}
syncStreaks();

const material = new THREE.ShaderMaterial({
    vertexShader:   vertSrc,
    fragmentShader: fragSrc,
    uniforms,
});
scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material));

// ─────────────────────────────────────────────
// GUI
// ─────────────────────────────────────────────
const gui = new lil.GUI({ title: 'Shader Gradient' });

const fColors = gui.addFolder('Gradient Colors');
fColors.addColor(params, 'color1').name('Color 1').onChange(v => uniforms.uColor1.value.set(v));
fColors.addColor(params, 'color2').name('Color 2').onChange(v => uniforms.uColor2.value.set(v));
fColors.addColor(params, 'color3').name('Color 3').onChange(v => uniforms.uColor3.value.set(v));
fColors.addColor(params, 'color4').name('Color 4').onChange(v => uniforms.uColor4.value.set(v));

const fBg = gui.addFolder('Background');
fBg.add(params, 'noiseScale', 0.1, 5, 0.05).name('Noise Scale')
    .onChange(v => uniforms.uNoiseScale.value = v);
fBg.add(params, 'speed', 0, 1, 0.005).name('Speed')
    .onChange(v => uniforms.uSpeed.value = v);
fBg.add(params, 'contrast', 0.4, 2, 0.01).name('Contrast')
    .onChange(v => uniforms.uContrast.value = v);
fBg.add(params, 'brightness', 0.4, 1.6, 0.01).name('Brightness')
    .onChange(v => uniforms.uBrightness.value = v);
fBg.add(params, 'grain', 0, 0.2, 0.005).name('Grain')
    .onChange(v => uniforms.uGrain.value = v);

const fS = gui.addFolder('Arcs');
fS.add(params, 'streakCount', 0, MAX_STREAKS, 1).name('Arc Count')
    .onChange(v => uniforms.uStreakCount.value = v);
fS.addColor(params, 'streakColor').name('Arc Color')
    .onChange(v => uniforms.uStreakColor.value.set(v));

for (let n = 1; n <= MAX_STREAKS; n++) {
    const fa = fS.addFolder(`Arc ${n}`);
    fa.add(params, `s${n}y`,  -0.5, 1.5, 0.005).name('Y Center').onChange(syncStreaks);
    fa.add(params, `s${n}c`,  -1.0, 1.0, 0.005).name('Curvature').onChange(syncStreaks);
    fa.add(params, `s${n}t`,  -1.0, 1.0, 0.005).name('Tilt').onChange(syncStreaks);
    fa.add(params, `s${n}th`,  0.005, 0.5, 0.001).name('Core Thickness').onChange(syncStreaks);
    fa.add(params, `s${n}i`,   0,    2,   0.01 ).name('Core Intensity').onChange(syncStreaks);
    fa.add(params, `s${n}h`,   0,    1,   0.01 ).name('Halo Intensity').onChange(syncStreaks);
    fa.add(params, `s${n}hw`,  0.02, 1,   0.01 ).name('Halo Width').onChange(syncStreaks);
    if (n > 2) fa.close();
}
fS.open();

// ─────────────────────────────────────────────
// Settings export / import (matches the pattern from other sims)
// ─────────────────────────────────────────────
function applyAllParams() {
    uniforms.uColor1.value.set(params.color1);
    uniforms.uColor2.value.set(params.color2);
    uniforms.uColor3.value.set(params.color3);
    uniforms.uColor4.value.set(params.color4);
    uniforms.uStreakColor.value.set(params.streakColor);
    uniforms.uNoiseScale.value = params.noiseScale;
    uniforms.uSpeed.value = params.speed;
    uniforms.uContrast.value = params.contrast;
    uniforms.uBrightness.value = params.brightness;
    uniforms.uGrain.value = params.grain;
    uniforms.uStreakCount.value = params.streakCount;
    syncStreaks();
    gui.controllersRecursive().forEach(c => c.updateDisplay());
}

const settingsIO = {
    copy: async () => {
        try {
            await navigator.clipboard.writeText(JSON.stringify(params, null, 2));
            console.log('Settings copied');
        } catch (e) { console.warn(e); }
    },
    paste: async () => {
        try {
            const txt = await navigator.clipboard.readText();
            const obj = JSON.parse(txt);
            Object.assign(params, obj);
            applyAllParams();
        } catch (e) { console.warn(e); }
    },
};
const fIO = gui.addFolder('Settings');
fIO.add(settingsIO, 'copy').name('Copy to clipboard');
fIO.add(settingsIO, 'paste').name('Paste from clipboard');
fIO.close();

// ─────────────────────────────────────────────
// Resize + render loop
// ─────────────────────────────────────────────
window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
});

const clock = new THREE.Clock();
function animate() {
    uniforms.uTime.value = clock.getElapsedTime();
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
