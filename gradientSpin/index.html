<script>
// ─────────────────────────────────────────────
// Gradient Spin — a full-screen fork of BIAsia/gradient-spin (MIT).
//
// The original is a loading spinner: a 3×3 grid of <span> cells sharing one
// CSS keyframe that animates opacity, where each cell's animation-delay comes
// from a distance function over the grid. Cells at equal distance light
// together, so the distance function *is* the wavefront shape. Colors are
// sampled from multi-stop gradients in OKLab so hue transitions never detour
// through gray.
//
// This fork keeps the good ideas and drops the constraints that came from
// being DOM + CSS:
//
//   • Cells are fragments, not nodes — thousands of them at 60fps.
//   • The wavefront is continuous. The original's keyframe (full → dim over
//     45%, hold, snap back over the last 8%) is one fixed comet; here attack,
//     decay and falloff curve are parameters. attack 0.08 / decay 0.45 /
//     gamma 1.0 reproduces the original exactly.
//   • `bands` generalizes the original's hardcoded SCROLL_BAND = 4 tiling and
//     applies it to every pattern, not just the two scrolling ones.
//   • Nine patterns instead of four. The four originals are ported faithfully;
//     spiral, sweep and two-source interference only make sense at this scale.
//   • The wave drives more than opacity: cells also swell, and can drag the
//     gradient ramp along with them.
//   • The OKLab ramp is evaluated per fragment, and all compositing happens in
//     linear light with an explicit sRGB encode at the end.
//   • A harmony accent derived from the palette by color theory rides the
//     leading crest, so the front reads as a chromatic event, not just "brighter".
//
// All eight original palettes are carried over verbatim.
// ─────────────────────────────────────────────

const MAX_STOPS = 14;

// ─────────────────────────────────────────────
// Palettes
//
// The first eight are ported verbatim from gradient-spin's presets.ts. The
// rest follow the same house style — a light desaturated head falling into a
// saturated tail — with the color relationship named for each. The sibling
// index-spinner.html carries the same set.
// ─────────────────────────────────────────────

    // split-complementary, a peach head landing on navy by way of mauve
    dusk: [

        ['#6E6BAE', 0.75], ['#33356B', 1],

const PATTERN_IDS = {
    'arrow-up': 0, diagonal: 1, snake: 2, ripple: 3, radial: 4,
    spiral: 5, sweep: 6, interference: 7, turbulence: 8,
};
const AXIS_IDS = { row: 0, column: 1, path: 2, radial: 3, diagonal: 4 };

// ─────────────────────────────────────────────
// Shaders
// ─────────────────────────────────────────────
const vertSrc = `
varying vec2 vUv;
void main() {
    vUv = uv;
    gl_Position = vec4(position, 1.0);
}
`;

const fragSrc = `
precision highp float;
varying vec2 vUv;

#define TAU 6.283185307179586

uniform vec2  uResolution;
uniform float uTime;

// Grid
uniform vec2  uGrid;            // (cols, rows)
uniform float uGap;             // fraction of a cell eaten by the gutter
uniform float uRadius;          // 0 = square corners, 1 = fully round
uniform float uDiamond;         // 0 = box, 1 = diamond

// Wavefront
uniform int   uPattern;
uniform float uBands;           // wave repetitions across the field
uniform float uFront;           // animated front position, advanced on the CPU
uniform float uAttack;          // leading-edge width, fraction of one cycle
uniform float uDecay;           // trailing comet length
uniform float uGamma;           // falloff curve
uniform float uSpiralArms;
uniform float uSpiralTwist;
uniform float uSourceSep;       // interference source separation
uniform float uNoiseScale;
uniform float uSeed;

// Response
uniform float uDim;             // resting brightness of unlit cells
uniform float uLift;            // brightness gain at the crest
uniform float uSwell;           // size gain at the crest
uniform float uShift;           // how far the crest drags the gradient ramp

// Color
uniform vec3  uStopLab[${MAX_STOPS}];   // stop colors, pre-converted to OKLab
uniform float uStopPos[${MAX_STOPS}];   // padded so [0]=0 and [n-1]=1 always
uniform int   uColorAxis;
uniform float uReversePalette;
uniform vec3  uAccentLin;
uniform float uAccentAmount;
uniform float uAccentSharp;

// Look
uniform vec3  uBgLin;
uniform float uGlow;
uniform float uGlowRadius;
uniform float uGrain;
uniform float uVignette;

// ── noise ──
float hash21(vec2 p) {
    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}
float vnoise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    vec2 u = f * f * (3.0 - 2.0 * f);
    return mix(
        mix(hash21(i),                  hash21(i + vec2(1.0, 0.0)), u.x),
        mix(hash21(i + vec2(0.0, 1.0)), hash21(i + vec2(1.0, 1.0)), u.x),
        u.y);
}
float fbm(vec2 p) {
    float v = 0.0;
    float a = 0.5;
    for (int k = 0; k < 4; k++) {
        v += a * vnoise(p);
        p *= 2.03;
        a *= 0.5;
    }
    return v;
}

// ── color ──
// OKLab → linear sRGB. The forward direction runs on the CPU, so the shader
// only ever needs this half.
vec3 oklabToLinear(vec3 lab) {
    float l_ = lab.x + 0.3963377774 * lab.y + 0.2158037573 * lab.z;
    float m_ = lab.x - 0.1055613458 * lab.y - 0.0638541728 * lab.z;
    float s_ = lab.x - 0.0894841775 * lab.y - 1.2914855480 * lab.z;
    vec3 lms = vec3(l_ * l_ * l_, m_ * m_ * m_, s_ * s_ * s_);
    return vec3(
         4.0767416621 * lms.x - 3.3077115913 * lms.y + 0.2309699292 * lms.z,
        -1.2684380046 * lms.x + 2.6097574011 * lms.y - 0.3413193965 * lms.z,
        -0.0041960863 * lms.x - 0.7034186147 * lms.y + 1.7076147010 * lms.z);
}
vec3 linearToSrgb(vec3 c) {
    c = clamp(c, 0.0, 1.0);
    return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055,
               step(vec3(0.0031308), c));
}

// Bloom pushes cells past 1.0. Clipping there would drag every hue toward
// white, so instead the whole color is scaled until its brightest channel
// lands under 1 — the ratios between channels survive, and so does the hue.
// Linear below the knee, C1-continuous across it.
vec3 shoulder(vec3 c) {
    float m = max(max(c.r, c.g), c.b);
    float knee = 0.75;
    if (m <= knee) return c;
    float mapped = knee + (1.0 - knee) * (1.0 - exp(-(m - knee) / (1.0 - knee)));
    return c * (mapped / max(m, 1e-4));
}

// Multi-stop ramp interpolated in OKLab. Stop positions are padded on the CPU
// so index 0 sits at 0.0 and the tail sits at 1.0 — every t is bracketed.
vec3 sampleRamp(float t) {
    t = clamp(mix(t, 1.0 - t, uReversePalette), 0.0, 1.0);
    for (int i = 0; i < ${MAX_STOPS - 1}; i++) {
        float p0 = uStopPos[i];
        float p1 = uStopPos[i + 1];
        if (t >= p0 && t <= p1) {
            float span = p1 - p0;
            float m = span > 1e-5 ? (t - p0) / span : 0.0;
            return oklabToLinear(mix(uStopLab[i], uStopLab[i + 1], m));
        }
    }
    return oklabToLinear(uStopLab[${MAX_STOPS - 1}]);
}

// ── shapes ──
float sdRoundBox(vec2 p, vec2 b, float r) {
    vec2 q = abs(p) - b + r;
    return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;
}
float sdDiamond(vec2 p, vec2 b) {
    vec2 q = abs(p);
    float f = q.x / max(b.x, 1e-4) + q.y / max(b.y, 1e-4) - 1.0;
    return f * min(b.x, b.y) * 0.70710678;
}

// ── wavefront ──
// Distance along the pattern's travel direction, normalized so one unit is one
// full traverse. Cells at equal distance light together.
float patternDistance(vec2 cell) {
    float cols = uGrid.x;
    float rows = uGrid.y;
    float cc = (cols - 1.0) * 0.5;
    float cr = (rows - 1.0) * 0.5;
    vec2  rel = vec2(cell.x - cc, cell.y - cr);
    float maxR = max(length(vec2(cc, cr)), 1e-4);

    if (uPattern == 0) {
        // arrow-up — chevron fold across the center column, apex climbing
        return ((rows - 1.0 - cell.y) + abs(cell.x - cc))
             / max(rows - 1.0 + cc, 1e-4);
    } else if (uPattern == 1) {
        // diagonal — anti-diagonal stripes toward the bottom-right
        return (cell.x + cell.y) / max(cols + rows - 2.0, 1e-4);
    } else if (uPattern == 2) {
        // snake — boustrophedon raster from the bottom-left. One front spans
        // every cell in the grid, so this pattern wants a high band count:
        // rows / bands is roughly how many rows one comet covers, whatever the
        // viewport. The original solved the same problem with a fixed
        // four-cell tiling, which is far too fine at this scale.
        float rowFromBottom = rows - 1.0 - cell.y;
        float ltr = step(mod(rowFromBottom, 2.0), 0.5);
        float x = mix(cols - 1.0 - cell.x, cell.x, ltr);
        return (rowFromBottom * cols + x) / max(rows * cols - 1.0, 1e-4);
    } else if (uPattern == 3) {
        // ripple — Chebyshev distance, expanding square rings
        return max(abs(rel.x), abs(rel.y)) / max(max(cc, cr), 1e-4);
    } else if (uPattern == 4) {
        // radial — Euclidean distance, circular rings
        return length(rel) / maxR;
    } else if (uPattern == 5) {
        // spiral — angle winds into radius, arms rotating outward
        float a = atan(rel.y, rel.x) / TAU;
        return a * uSpiralArms + (length(rel) / maxR) * uSpiralTwist;
    } else if (uPattern == 6) {
        // sweep — pure angle, a radar hand
        return atan(rel.y, rel.x) / TAU + 0.5;
    } else if (uPattern == 7) {
        // interference — confocal ellipses, used only for the color axis
        vec2 s = vec2(cc * uSourceSep, 0.0);
        return (length(rel - s) + length(rel + s)) / (2.0 * maxR);
    }
    // turbulence — an FBM field standing in for the distance function
    return fbm(vec2(cell.x / max(cols, 1.0), cell.y / max(rows, 1.0))
               * uNoiseScale * 4.0 + uSeed);
}

// The original's keyframe was a fixed comet: opacity fell from full to dim
// over 45% of the cycle, held, then snapped back over the last 8%. Here both
// edges and the curve between them are free.
float frontProfile(float q) {
    float w = 0.0;
    w = max(w, 1.0 - q / max(uDecay, 1e-4));
    w = max(w, 1.0 - (1.0 - q) / max(uAttack, 1e-4));
    return pow(clamp(w, 0.0, 1.0), uGamma);
}

float waveFromDistance(float d) {
    return frontProfile(fract(d * uBands - uFront));
}

float waveAt(vec2 cell) {
    if (uPattern == 7) {
        // Two point sources emitting their own ring fronts. Taking the max of
        // two profiles gives real crossing wavefronts rather than a single
        // field that merely looks elliptical.
        float cc = (uGrid.x - 1.0) * 0.5;
        float cr = (uGrid.y - 1.0) * 0.5;
        vec2  rel = vec2(cell.x - cc, cell.y - cr);
        vec2  s = vec2(cc * uSourceSep, 0.0);
        float maxR = max(length(vec2(cc, cr)), 1e-4);
        return max(waveFromDistance(length(rel - s) / maxR),
                   waveFromDistance(length(rel + s) / maxR));
    }
    return waveFromDistance(patternDistance(cell));
}

void main() {
    vec2 uv = vUv;
    vec2 g  = uv * uGrid;
    vec2 cell = floor(g);
    vec2 f    = fract(g);

    float wave = waveAt(cell);

    // ── where this cell sits on the color ramp ──
    float t;
    if      (uColorAxis == 0) t = 1.0 - uv.y;                    // row, top → bottom
    else if (uColorAxis == 1) t = uv.x;                          // column
    else if (uColorAxis == 2) t = patternDistance(cell);         // along the wave's path
    else if (uColorAxis == 3) t = length(uv - 0.5) * 1.41421;    // radial
    else                      t = (uv.x + 1.0 - uv.y) * 0.5;     // diagonal
    t = clamp(t + uShift * wave, 0.0, 1.0);

    vec3 base = sampleRamp(t);

    // Harmony accent rides the leading crest only, so the front carries a hue
    // shift instead of just more light.
    base = mix(base, uAccentLin, uAccentAmount * pow(wave, uAccentSharp));

    // ── cell shape ──
    vec2  p = f * 2.0 - 1.0;
    float scale = mix(1.0 - uSwell * 0.5, 1.0 + uSwell * 0.5, wave);
    vec2  half_ = vec2(max(1.0 - uGap, 0.02)) * scale;
    float rad = uRadius * min(half_.x, half_.y);
    float d = mix(sdRoundBox(p, half_, rad), sdDiamond(p, half_), uDiamond);
    float aa = max(fwidth(d), 1e-4);
    float mask = 1.0 - smoothstep(-aa, aa, d);

    float lum = mix(uDim, 1.0, clamp(wave * uLift, 0.0, 1.0));

    vec3 col = mix(uBgLin, base * lum, mask);

    // Bloom: full inside the cell, falling off through the gutter.
    col += base * (exp(-max(d, 0.0) * uGlowRadius) * uGlow * pow(wave, 1.6));

    float vig = 1.0 - uVignette * pow(length(uv - 0.5) * 1.35, 2.2);
    col *= clamp(vig, 0.0, 1.0);

    vec3 srgb = linearToSrgb(shoulder(col));
    srgb += (hash21(uv * uResolution + fract(uTime) * 91.7) - 0.5) * uGrain;

    gl_FragColor = vec4(clamp(srgb, 0.0, 1.0), 1.0);
}
`;

// ─────────────────────────────────────────────
// Color helpers (CPU side)
// ─────────────────────────────────────────────
function hexToRgb(hex) {
    let h = hex.replace(/^#/, '');
    if (h.length === 3) h = h.split('').map(c => c + c).join('');
    return [
        parseInt(h.slice(0, 2), 16) / 255,
        parseInt(h.slice(2, 4), 16) / 255,
        parseInt(h.slice(4, 6), 16) / 255,
    ];
}
function srgbToLinear(v) {
    return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
}
function hexToLinear(hex) {
    return hexToRgb(hex).map(srgbToLinear);
}
function hexToOklab(hex) {
    const [r, g, b] = hexToLinear(hex);
    const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
    const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
    const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
    return [
        0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s,
        1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s,
        0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s,
    ];
}
function linearToSrgbC(v) {
    const c = Math.min(Math.max(v, 0), 1);
    return c <= 0.0031308 ? c * 12.92 : 1.055 * Math.pow(c, 1 / 2.4) - 0.055;
}
function oklabToHex(lab) {
    const [l, a, b] = lab;
    const lc = Math.pow(l + 0.3963377774 * a + 0.2158037573 * b, 3);
    const mc = Math.pow(l - 0.1055613458 * a - 0.0638541728 * b, 3);
    const sc = Math.pow(l - 0.0894841775 * a - 1.2914855480 * b, 3);
    return '#' + [
         4.0767416621 * lc - 3.3077115913 * mc + 0.2309699292 * sc,
        -1.2684380046 * lc + 2.6097574011 * mc - 0.3413193965 * sc,
        -0.0041960863 * lc - 0.7034186147 * mc + 1.7076147010 * sc,
    ].map(v => Math.round(linearToSrgbC(v) * 255).toString(16).padStart(2, '0')).join('');
}
// CPU mirror of the shader's sampleRamp — same OKLab interpolation, so a ramp
// resampled here matches what is on screen.
function sampleStopsHex(stops, t) {
    const first = stops[0], last = stops[stops.length - 1];
    t = Math.min(Math.max(t, first[1]), last[1]);
    let lo = first, hi = last;
    for (let i = 0; i < stops.length - 1; i++) {
        if (t >= stops[i][1] && t <= stops[i + 1][1]) { lo = stops[i]; hi = stops[i + 1]; break; }
    }
    const span = hi[1] - lo[1];
    const m = span > 1e-6 ? (t - lo[1]) / span : 0;
    const A = hexToOklab(lo[0]), B = hexToOklab(hi[0]);
    return oklabToHex([0, 1, 2].map(i => A[i] + (B[i] - A[i]) * m));
}
function hexToHsl(hex) {
    const [r, g, b] = hexToRgb(hex);
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    const l = (max + min) / 2;
    const dd = max - min;
    if (dd < 1e-6) return [0, 0, l];
    const s = l > 0.5 ? dd / (2 - max - min) : dd / (max + min);
    let h;
    if (max === r)      h = ((g - b) / dd + (g < b ? 6 : 0)) / 6;
    else if (max === g) h = ((b - r) / dd + 2) / 6;
    else                h = ((r - g) / dd + 4) / 6;
    return [h, s, l];
}
function hslToHex(h, s, l) {
    h = ((h % 1) + 1) % 1;
    const c = (1 - Math.abs(2 * l - 1)) * s;
    const x = c * (1 - Math.abs(((h * 6) % 2) - 1));
    const m = l - c / 2;
    const seg = Math.floor(h * 6) % 6;
    const t = [[c, x, 0], [x, c, 0], [0, c, x], [0, x, c], [x, 0, c], [c, 0, x]][seg];
    return '#' + t.map(v => Math.round((v + m) * 255).toString(16).padStart(2, '0')).join('');
}

// ─────────────────────────────────────────────
// Parameters
// ─────────────────────────────────────────────
const params = {
    palette: 'bay',
    reversePalette: false,
    custom1: '#DBE3D0', custom2: '#8DB8A7', custom3: '#2D8E9A',
    custom4: '#154288', custom5: '#262C81',

    pattern:     'ripple',
    bands:       3.0,
    period:      3.2,
    reverse:     false,
    paused:      false,
    attack:      0.10,
    decay:       0.45,

// ─────────────────────────────────────────────
// Palette upload
//
// Stops are converted to OKLab here so the shader only does the cheap half of
// the round trip. Positions are padded to span exactly 0..1 — a flat run at
// either end where the source ramp does not reach the edge, which is what the
// original's clamp did — so every sample point is bracketed by a real pair and
// the shader needs no stop count.
// ─────────────────────────────────────────────
function currentStops() {
    if (params.palette === 'custom') {
        return [params.custom1, params.custom2, params.custom3,
                params.custom4, params.custom5]
            .map((c, i, a) => [c, i / (a.length - 1)]);
    }
    return GRADIENTS[params.palette];
}

function uploadPalette() {
    const src = currentStops();
    const padded = src.map(([c, p]) => [c, p]);
    if (padded[0][1] > 0)                    padded.unshift([padded[0][0], 0]);
    if (padded[padded.length - 1][1] < 1)    padded.push([padded[padded.length - 1][0], 1]);

    const last = padded[padded.length - 1];
    for (let i = 0; i < MAX_STOPS; i++) {
        const [hex, pos] = i < padded.length ? padded[i] : last;
        const lab = hexToOklab(hex);
        uniforms.uStopLab.value[i].set(lab[0], lab[1], lab[2]);
        uniforms.uStopPos.value[i] = i < padded.length ? pos : 1;
    }
}

// The stop nearest the middle of the ramp is the most representative single
// color in the palette, so the harmony relationship is derived from it.
function paletteAnchor() {
    const stops = currentStops();
    let best = stops[0], bestD = 1;
    for (const s of stops) {
        const d = Math.abs(s[1] - 0.5);
        if (d < bestD) { bestD = d; best = s; }
    }
    return best[0];
}

// Accent derived from the palette by color theory, then softened toward
// pastel. `manual` leaves whatever color was hand-picked alone.
const HARMONY_OFFSETS = {
    complementary:   0.5,
    'split-warm':    150 / 360,
    'split-cool':    210 / 360,
    analogous:       30 / 360,
    triadic:         120 / 360,
};
function deriveAccent() {
    if (params.accentHarmony === 'manual') return params.accentColor;
    const [h, s, l] = hexToHsl(paletteAnchor());
    const hue = h + HARMONY_OFFSETS[params.accentHarmony];
    const k = params.accentPastel;
    return hslToHex(hue, s * (1 - k) + 0.45 * k, l * (1 - k) + 0.84 * k);
}

function applyAccent() {
    params.accentColor = deriveAccent();
    const [r, g, b] = hexToLinear(params.accentColor);
    uniforms.uAccentLin.value.set(r, g, b);
}

// ─────────────────────────────────────────────
// Grid sizing — square cells derive the column count from the viewport
// ─────────────────────────────────────────────
function updateGrid() {
    if (params.squareCells) {
        const aspect = window.innerWidth / Math.max(window.innerHeight, 1);
        params.cols = Math.max(2, Math.round(params.rows * aspect));

    uniforms.uGrid.value.set(params.cols, params.rows);
}

function flash(ctrl, label, revert) {
    ctrl.name(label);
    setTimeout(() => ctrl.name(revert), 1400);
}

async function copySettings() {
    const text = JSON.stringify(params, null, 2);
    try {
        await navigator.clipboard.writeText(text);
        flash(copyCtrl, 'Copied ✓', 'Copy Settings');
    } catch {
        window.prompt('Copy these settings:', text);
        flash(copyCtrl, 'Copy manually', 'Copy Settings');
    }
}

async function pasteSettings() {
    let text = '';
    try { text = await navigator.clipboard.readText(); } catch {}
    if (!text) text = window.prompt('Paste settings JSON:') || '';
    if (!text.trim()) return;
    let data;
    try { data = JSON.parse(text); }
    catch { flash(pasteCtrl, 'Invalid JSON', 'Paste Settings'); return; }
    Object.assign(params, data);
    applyAllParams();
    flash(pasteCtrl, 'Applied ✓', 'Paste Settings');
}

function savePNG() {
    renderer.render(scene, camera);
    renderer.domElement.toBlob(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `gradient-spin-${Date.now()}.png`;
        document.body.appendChild(a); a.click(); a.remove();
        URL.revokeObjectURL(url);
    });
}

function recordVideo() {
    const candidates = [
        'video/mp4;codecs=avc1.42E01E',
        'video/mp4',
        'video/webm;codecs=vp9',
        'video/webm;codecs=vp8',
        'video/webm',
    ];
    const mime = candidates.find(t =>
        window.MediaRecorder && MediaRecorder.isTypeSupported(t));
    if (!mime) { flash(recordCtrl, 'Unsupported', 'Record 6s MP4'); return; }
    const ext = mime.startsWith('video/mp4') ? 'mp4' : 'webm';

    const stream = renderer.domElement.captureStream(60);
    const recorder = new MediaRecorder(stream, {
        mimeType: mime, videoBitsPerSecond: 12_000_000,
    });
    const chunks = [];
    recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    recorder.onstop = () => {
        const blob = new Blob(chunks, { type: mime });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement('a');
        a.href = url;
        a.download = `gradient-spin-${Date.now()}.${ext}`;
        document.body.appendChild(a); a.click(); a.remove();
        URL.revokeObjectURL(url);
        recordCtrl.name('Record 6s MP4');
    };
    recorder.start();
    const t0 = performance.now();
    const tick = () => {
        const elapsed = (performance.now() - t0) / 1000;
        if (elapsed >= 6) { recorder.stop(); return; }
        recordCtrl.name(`Recording… ${(6 - elapsed).toFixed(1)}s`);
        requestAnimationFrame(tick);
    };
    tick();
}

function animate() {
    const dt = Math.min(clock.getDelta(), 0.1);
    uniforms.uTime.value = clock.getElapsedTime();

    if (!params.paused) {
        const step = dt / Math.max(params.period, 0.05);
        uniforms.uFront.value = (uniforms.uFront.value +
            (params.reverse ? -step : step) + 1) % 1;
    }

    renderer.render(scene, camera);
    requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
