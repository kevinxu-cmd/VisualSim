<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataPulse</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        canvas { display: block; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.19"></script>
</head>
<body>
<script>
// ─────────────────────────────────────────────
// Constants
// ─────────────────────────────────────────────
const MAX_FIBERS       = 150;   // pre-allocated cap per network
const POINTS_PER_FIBER = 220;
const WORLD_HALF_H     = 6.5;   // camera z=14, FOV=50 → 14*tan(25°)

// ─────────────────────────────────────────────
// Renderer / Scene / Camera
// ─────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x000000, 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    50, window.innerWidth / window.innerHeight, 0.1, 200
);
camera.position.set(0, 0, 14);

// ─────────────────────────────────────────────
// Global parameters
// ─────────────────────────────────────────────
const globalParams = {
    backgroundColor:   '#000000',
    particleColor:     '#FF8000',
    particleSpeed:     0.20,
    particleSpawnRate: 1,
    glow:              true,
};

// ─────────────────────────────────────────────
// Per-network defaults  (values from screenshot)
// ─────────────────────────────────────────────
function defaultNet(isA) {
    return {
        startX: isA ? -0.28 : -0.10,
        startY: isA ?  1.00 :  1.00,
        endX:   isA ?  0.92 :  0.84,
        endY:   isA ? -0.90 : -1.00,
        curveX: 0,
        curveY: 0,
        twist:           isA ? 0.00 : 0.23,
        maxSpread:       isA ? 2.84 : 2.19,
        spreadCenter:    isA ? 0.66 : 0.59,
        spreadSharpness: isA ? 1.00 : 1.60,
        structuralNoise: isA ? 0.14 : 0.06,
        lineColor:       '#51647B',
        lineOpacity:     isA ? 0.72 : 0.64,
        lineThickness:   0.018,   // world-space full width (~1.5 px default)
        fiberCount:      80,
        mode3D:          true,
        cloth:           false,
    };
}

// ─────────────────────────────────────────────
// Fiber
// Rendered as a billboard ribbon (MeshBasicMaterial
// + indexed triangle strip) so lineThickness works
// on any GPU — WebGL doesn't support linewidth > 1.
// this.positions = centerline, read by particles.
// ─────────────────────────────────────────────
class Fiber {
    constructor(material) {
        this.maxPoints = POINTS_PER_FIBER;
        this.positions = new Float32Array(this.maxPoints * 3); // centerline
        this.baseAngle = Math.random() * Math.PI * 2;
        this.noiseSeed = Math.random() * 100;

        // Ribbon: 2 verts per centerline point (+ / − side)
        this.ribbonPos = new Float32Array(this.maxPoints * 2 * 3);

        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position',
            new THREE.BufferAttribute(this.ribbonPos, 3));
        geo.attributes.position.setUsage(THREE.DynamicDrawUsage);

        // One quad (2 triangles) per segment
        const idx = new Uint32Array((this.maxPoints - 1) * 6);
        for (let i = 0; i < this.maxPoints - 1; i++) {
            const a = i*2, b = i*2+1, c = (i+1)*2, d = (i+1)*2+1;
            idx[i*6]   = a; idx[i*6+1] = b; idx[i*6+2] = c;
            idx[i*6+3] = b; idx[i*6+4] = d; idx[i*6+5] = c;
        }
        geo.setIndex(new THREE.BufferAttribute(idx, 1));

        this.geometry = geo;
        this.mesh = new THREE.Mesh(geo, material);
        this.mesh.frustumCulled = false;
        scene.add(this.mesh);
    }

    update(time, p) {
        this._centerline(time, p);
        this._ribbon(Math.max(p.lineThickness * 0.5, 0.002));
        this.geometry.attributes.position.needsUpdate = true;
    }

    _centerline(time, p) {
        const hw = WORLD_HALF_H * camera.aspect;
        const hh = WORLD_HALF_H;

        // Bezier control points
        const ax = p.startX * hw, ay = p.startY * hh;
        const cx = p.endX   * hw, cy = p.endY   * hh;
        const bx = (ax + cx) * 0.5 + p.curveX * hw;
        const by = (ay + cy) * 0.5 + p.curveY * hh;

        for (let i = 0; i < this.maxPoints; i++) {
            const t  = i / (this.maxPoints - 1);
            const mt = 1 - t;

            // Quadratic Bezier position
            const spx = mt*mt*ax + 2*mt*t*bx + t*t*cx;
            const spy = mt*mt*ay + 2*mt*t*by + t*t*cy;

            // Tangent → local right frame
            const tanX = 2*(1-t)*(bx-ax) + 2*t*(cx-bx);
            const tanY = 2*(1-t)*(by-ay) + 2*t*(cy-by);
            const tl   = Math.sqrt(tanX*tanX + tanY*tanY) || 1;
            const rX   = -tanY / tl,  rY = tanX / tl;

            // Gaussian spread bell-curve
            const dt     = t - p.spreadCenter;
            const spread = p.maxSpread * Math.exp(-dt * dt * p.spreadSharpness * 10);

            // Helical twist
            const angle    = this.baseAngle + p.twist * t * Math.PI * 2;
            const offRight = Math.cos(angle) * spread;
            const offZ     = p.mode3D ? Math.sin(angle) * spread : 0;

            // Organic noise (quieter at pinch)
            const noiseAmt = p.structuralNoise * spread;
            const noiseR   = Math.sin(i*0.08 + this.noiseSeed + time*0.8)  * noiseAmt;
            const noiseZ   = p.mode3D
                ? Math.cos(i*0.10 - this.noiseSeed + time*0.6) * noiseAmt * 0.5
                : 0;

            this.positions[i*3]   = spx + (offRight + noiseR) * rX;
            this.positions[i*3+1] = spy + (offRight + noiseR) * rY;
            this.positions[i*3+2] = offZ + noiseZ;
        }
    }

    // Expand centerline to a screen-aligned ribbon of halfWidth
    _ribbon(halfW) {
        const c = this.positions;
        const r = this.ribbonPos;
        const n = this.maxPoints;

        for (let i = 0; i < n; i++) {
            // Finite-difference tangent in XY
            const pi = Math.max(0, i-1) * 3;
            const ni = Math.min(n-1, i+1) * 3;
            const tx = c[ni]   - c[pi];
            const ty = c[ni+1] - c[pi+1];
            const tl = Math.sqrt(tx*tx + ty*ty) || 0.001;

            // Normal perpendicular to tangent (XY plane)
            const nx = -ty / tl * halfW;
            const ny =  tx / tl * halfW;

            const v0 = i * 6,  v1 = i * 6 + 3;   // two verts per point
            r[v0]   = c[i*3] + nx;  r[v0+1] = c[i*3+1] + ny;  r[v0+2] = c[i*3+2];
            r[v1]   = c[i*3] - nx;  r[v1+1] = c[i*3+1] - ny;  r[v1+2] = c[i*3+2];
        }
    }

    dispose() {
        scene.remove(this.mesh);
        this.geometry.dispose();
    }
}

// ─────────────────────────────────────────────
// ClothPanel
// Connects two adjacent fibers as a triangle strip
// for a cloth-in-the-wind look. Reads fiber.positions.
// ─────────────────────────────────────────────
class ClothPanel {
    constructor(material, fiberA, fiberB) {
        this.fiberA = fiberA;
        this.fiberB = fiberB;
        this.maxPoints = POINTS_PER_FIBER;
        this.positions = new Float32Array(this.maxPoints * 2 * 3);

        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position',
            new THREE.BufferAttribute(this.positions, 3));
        geo.attributes.position.setUsage(THREE.DynamicDrawUsage);

        const idx = new Uint32Array((this.maxPoints - 1) * 6);
        for (let i = 0; i < this.maxPoints - 1; i++) {
            const a = i*2, b = i*2+1, c = (i+1)*2, d = (i+1)*2+1;
            idx[i*6]   = a; idx[i*6+1] = b; idx[i*6+2] = c;
            idx[i*6+3] = b; idx[i*6+4] = d; idx[i*6+5] = c;
        }
        geo.setIndex(new THREE.BufferAttribute(idx, 1));

        this.geometry = geo;
        this.mesh = new THREE.Mesh(geo, material);
        this.mesh.frustumCulled = false;
        this.mesh.visible = false;
        scene.add(this.mesh);
    }

    update() {
        const a = this.fiberA.positions;
        const b = this.fiberB.positions;
        const r = this.positions;
        for (let i = 0; i < this.maxPoints; i++) {
            const i3 = i * 3, i6 = i * 6;
            r[i6]   = a[i3];   r[i6+1] = a[i3+1]; r[i6+2] = a[i3+2];
            r[i6+3] = b[i3];   r[i6+4] = b[i3+1]; r[i6+5] = b[i3+2];
        }
        this.geometry.attributes.position.needsUpdate = true;
    }

    dispose() {
        scene.remove(this.mesh);
        this.geometry.dispose();
    }
}

// ─────────────────────────────────────────────
// ParticleSystem  (unchanged — reads fiber.positions)
// ─────────────────────────────────────────────
class ParticleSystem {
    constructor(fibers) {
        this.fibers = fibers;
        const MAX   = 2000;
        this.max    = MAX;

        this.pool = Array.from({ length: MAX }, (_, id) => ({
            id, active: false, fiber: null, progress: 0, speed: 0,
        }));
        this.positions = new Float32Array(MAX * 3);
        this.alphas    = new Float32Array(MAX);

        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(this.positions, 3));
        geo.setAttribute('alpha',    new THREE.BufferAttribute(this.alphas, 1));

        this.material = new THREE.ShaderMaterial({
            uniforms: { uColor: { value: new THREE.Color(globalParams.particleColor) } },
            vertexShader: `
                attribute float alpha; varying float vAlpha;
                void main() {
                    vAlpha = alpha; gl_PointSize = 2.0;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
                }`,
            fragmentShader: `
                uniform vec3 uColor; varying float vAlpha;
                void main() {
                    if (vAlpha < 0.01) discard;
                    gl_FragColor = vec4(uColor, vAlpha);
                }`,
            transparent: true, depthWrite: false,
            blending: globalParams.glow ? THREE.AdditiveBlending : THREE.NormalBlending,
        });

        this.mesh = new THREE.Points(geo, this.material);
        this.mesh.frustumCulled = false;
        scene.add(this.mesh);
    }

    spawn(progress = 0) {
        if (!this.fibers.length) return;
        const slot = this.pool.find(p => !p.active);
        if (!slot) return;
        slot.active   = true;
        slot.fiber    = this.fibers[Math.floor(Math.random() * this.fibers.length)];
        slot.progress = progress;
        slot.speed    = globalParams.particleSpeed * (0.8 + Math.random() * 0.4);
    }

    update() {
        let dirty = false;
        for (let i = 0; i < this.max; i++) {
            const p = this.pool[i];
            if (!p.active) { this.alphas[i] = 0; continue; }

            p.progress += p.speed;
            const maxP = p.fiber.maxPoints - 2;
            if (p.progress >= maxP) {
                p.active = false; p.fiber = null;
                this.alphas[i] = 0; dirty = true; continue;
            }

            const fade = Math.min(p.progress / 25, 1) *
                         Math.min((maxP - p.progress) / 25, 1);
            const i0 = Math.floor(p.progress), i1 = i0 + 1;
            const t  = p.progress - i0;
            const fp = p.fiber.positions;

            this.positions[i*3]   = fp[i0*3]   + (fp[i1*3]   - fp[i0*3])   * t;
            this.positions[i*3+1] = fp[i0*3+1] + (fp[i1*3+1] - fp[i0*3+1]) * t;
            this.positions[i*3+2] = fp[i0*3+2] + (fp[i1*3+2] - fp[i0*3+2]) * t;
            this.alphas[i]        = fade;
            dirty                 = true;
        }
        if (dirty) {
            this.mesh.geometry.attributes.position.needsUpdate = true;
            this.mesh.geometry.attributes.alpha.needsUpdate    = true;
        }
    }

    dispose() {
        scene.remove(this.mesh);
        this.mesh.geometry.dispose();
        this.material.dispose();
    }
}

// ─────────────────────────────────────────────
// Network
// Pre-allocates MAX_FIBERS; visibility is toggled
// by fiberCount so changes are instant & cheap.
// ─────────────────────────────────────────────
class Network {
    constructor(params) {
        this.params = params;

        this.lineMaterial = new THREE.MeshBasicMaterial({
            color:       new THREE.Color(params.lineColor),
            transparent: true,
            opacity:     params.lineOpacity,
            blending:    globalParams.glow ? THREE.AdditiveBlending : THREE.NormalBlending,
            depthWrite:  false,
            side:        THREE.DoubleSide,
        });

        // Pre-allocate full pool
        this.allFibers = Array.from({ length: MAX_FIBERS },
            () => new Fiber(this.lineMaterial));

        // One cloth panel per adjacent fiber pair (0&1, 2&3, …)
        this.allPanels = Array.from({ length: Math.floor(MAX_FIBERS / 2) },
            (_, i) => new ClothPanel(
                this.lineMaterial,
                this.allFibers[i * 2],
                this.allFibers[i * 2 + 1],
            ));

        this._applyCount();

        this.particles = new ParticleSystem(this.activeFibers);

        // Pre-warm
        for (let i = 0; i < 600; i++)
            this.particles.spawn(Math.random() * (POINTS_PER_FIBER - 2));
        this.particles.update();
    }

    // Show only the first fiberCount fibers; update particle pool
    _applyCount() {
        const n = Math.round(this.params.fiberCount);
        this.allFibers.forEach((f, i) => { f.mesh.visible = i < n; });
        this.activeFibers = this.allFibers.slice(0, n);
        if (this.particles) this.particles.fibers = this.activeFibers;
        this._applyCloth();
    }

    // Show panels only when cloth mode is on AND both paired fibers are active
    _applyCloth() {
        const n    = Math.round(this.params.fiberCount);
        const cloth = !!this.params.cloth;
        this.allPanels.forEach((panel, i) => {
            panel.mesh.visible = cloth && (i * 2 + 1) < n;
        });
    }

    update(time) {
        const n = Math.round(this.params.fiberCount);
        for (let i = 0; i < n; i++)
            this.allFibers[i].update(time, this.params);

        if (this.params.cloth) {
            const panels = Math.floor(n / 2);
            for (let i = 0; i < panels; i++) this.allPanels[i].update();
        }

        for (let i = 0; i < globalParams.particleSpawnRate; i++)
            this.particles.spawn(0);
        this.particles.update();
    }

    dispose() {
        this.allFibers.forEach(f => f.dispose());
        this.allPanels.forEach(p => p.dispose());
        this.particles.dispose();
        this.lineMaterial.dispose();
    }
}

// ─────────────────────────────────────────────
// Instantiate
// ─────────────────────────────────────────────
const paramsA = defaultNet(true);
const paramsB = defaultNet(false);
const netA    = new Network(paramsA);
const netB    = new Network(paramsB);

// ─────────────────────────────────────────────
// GUI
// ─────────────────────────────────────────────
window.onload = () => {
    const gui = new lil.GUI({ title: 'DataPulse' });
    gui.close();

    // ───────── Settings copy / paste ─────────
    function applyAllParams() {
        renderer.setClearColor(globalParams.backgroundColor);
        const mode = globalParams.glow ? THREE.AdditiveBlending : THREE.NormalBlending;
        [netA, netB].forEach(net => {
            const p = net.params;
            net.lineMaterial.color.set(p.lineColor);
            net.lineMaterial.opacity = p.lineOpacity;
            net.lineMaterial.blending = mode;
            net.lineMaterial.needsUpdate = true;
            net.particles.material.uniforms.uColor.value.set(globalParams.particleColor);
            net.particles.material.blending = mode;
            net.particles.material.needsUpdate = true;
            net._applyCount(); // also refreshes cloth
        });
        gui.controllersRecursive().forEach(c => c.updateDisplay());
    }

    async function copySettings() {
        const text = JSON.stringify(
            { global: globalParams, netA: paramsA, netB: paramsB }, null, 2);
        try {
            await navigator.clipboard.writeText(text);
            alert('Settings copied to clipboard.');
        } catch {
            window.prompt('Copy these settings:', text);
        }
    }

    async function pasteSettings() {
        let text = '';
        try { text = await navigator.clipboard.readText(); } catch {}
        if (!text) text = window.prompt('Paste settings JSON:') || '';
        if (!text.trim()) return;
        let data;
        try { data = JSON.parse(text); }
        catch { alert('Invalid JSON.'); return; }
        Object.assign(globalParams, data.global || {});
        Object.assign(paramsA,      data.netA   || {});
        Object.assign(paramsB,      data.netB   || {});
        applyAllParams();
    }

    // ───────── Video recording ─────────
    function recordVideo() {
        const candidates = [
            'video/mp4;codecs=avc1.42E01E',
            'video/mp4',
            'video/webm;codecs=vp9',
            'video/webm;codecs=vp8',
            'video/webm',
        ];
        const mime = candidates.find(t =>
            window.MediaRecorder && MediaRecorder.isTypeSupported(t));
        if (!mime) { alert('MediaRecorder not supported in this browser.'); return; }
        const ext = mime.startsWith('video/mp4') ? 'mp4' : 'webm';

        const stream = renderer.domElement.captureStream(60);
        const recorder = new MediaRecorder(stream, {
            mimeType: mime, videoBitsPerSecond: 12_000_000,
        });
        const chunks = [];
        recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
        recorder.onstop = () => {
            const blob = new Blob(chunks, { type: mime });
            const url  = URL.createObjectURL(blob);
            const a    = document.createElement('a');
            a.href = url;
            a.download = `datapulse-${Date.now()}.${ext}`;
            document.body.appendChild(a); a.click(); a.remove();
            URL.revokeObjectURL(url);
            recordCtrl.name(`Record 6s MP4`);
        };
        recorder.start();
        const t0 = performance.now();
        const tick = () => {
            const elapsed = (performance.now() - t0) / 1000;
            if (elapsed >= 6) { recorder.stop(); return; }
            recordCtrl.name(`Recording… ${(6 - elapsed).toFixed(1)}s`);
            requestAnimationFrame(tick);
        };
        tick();
    }

    const fIO = gui.addFolder('Export / Import');
    const actions = { copy: copySettings, paste: pasteSettings, record: recordVideo };
    fIO.add(actions, 'copy').name('Copy Settings');
    fIO.add(actions, 'paste').name('Paste Settings');
    const recordCtrl = fIO.add(actions, 'record').name('Record 6s MP4');

    const fCol = gui.addFolder('Colors');
    fCol.addColor(globalParams, 'backgroundColor').name('Background')
        .onChange(c => renderer.setClearColor(c));
    fCol.addColor(globalParams, 'particleColor').name('Particles')
        .onChange(c => {
            netA.particles.material.uniforms.uColor.value.set(c);
            netB.particles.material.uniforms.uColor.value.set(c);
        });
    fCol.add(globalParams, 'glow').name('Glow')
        .onChange(v => {
            const mode = v ? THREE.AdditiveBlending : THREE.NormalBlending;
            [netA.lineMaterial, netB.lineMaterial,
             netA.particles.material, netB.particles.material]
                .forEach(m => { m.blending = mode; m.needsUpdate = true; });
        });

    const fPart = gui.addFolder('Particles');
    fPart.add(globalParams, 'particleSpeed',     0, 3,  0.01).name('Speed');
    fPart.add(globalParams, 'particleSpawnRate', 0, 20, 1).name('Spawn Rate');

    function buildNetFolder(label, p, net) {
        const f = gui.addFolder(label);

        f.addColor(p, 'lineColor').name('Line Color')
            .onChange(c => net.lineMaterial.color.set(c));
        f.add(p, 'lineOpacity', 0, 1, 0.01).name('Opacity')
            .onChange(v => { net.lineMaterial.opacity = v; });
        f.add(p, 'lineThickness', 0.005, 0.5, 0.005).name('Line Thickness');
        f.add(p, 'fiberCount', 1, MAX_FIBERS, 1).name('Fiber Count')
            .onChange(() => net._applyCount());
        f.add(p, 'mode3D').name('3D Mode');
        f.add(p, 'cloth').name('Cloth')
            .onChange(() => net._applyCloth());

        const fPos = f.addFolder('Position');
        fPos.add(p, 'startX', -1, 1, 0.01).name('Start X');
        fPos.add(p, 'startY', -1, 1, 0.01).name('Start Y');
        fPos.add(p, 'endX',   -1, 1, 0.01).name('End X');
        fPos.add(p, 'endY',   -1, 1, 0.01).name('End Y');
        fPos.add(p, 'curveX', -1, 1, 0.01).name('Curve X');
        fPos.add(p, 'curveY', -1, 1, 0.01).name('Curve Y');

        const fShape = f.addFolder('Shape');
        fShape.add(p, 'twist',           -4, 4, 0.01).name('Twist');
        fShape.add(p, 'maxSpread',        0, 5, 0.01).name('Max Spread');
        fShape.add(p, 'spreadCenter',     0, 1, 0.01).name('Spread Center');
        fShape.add(p, 'spreadSharpness', 0.5, 8, 0.1).name('Spread Sharpness');
        fShape.add(p, 'structuralNoise',  0, 2, 0.01).name('Organic Noise');
    }

    buildNetFolder('Network A', paramsA, netA);
    buildNetFolder('Network B', paramsB, netB);

    animate();
};

// ─────────────────────────────────────────────
// Loop
// ─────────────────────────────────────────────
const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);
    const time = clock.getElapsedTime();
    netA.update(time);
    netB.update(time);
    renderer.render(scene, camera);
}

// ─────────────────────────────────────────────
// Resize
// ─────────────────────────────────────────────
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
